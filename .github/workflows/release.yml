name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Check tag matches sheppy.__version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv run --no-project --with . python -c 'import sheppy; print(sheppy.__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match sheppy.__version__ ($pkg)" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
