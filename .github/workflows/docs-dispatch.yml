name: docs dispatch

on:
  push:
    branches: [main]
    paths: ['docs/**', 'install.sh']
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # DOCS_DISPATCH_TOKEN is not provisioned yet; skip cleanly until the
    # org secret exists rather than failing red on every docs push.
    # `secrets` isn't a usable context in an `if:` (job- or step-level), so
    # it's routed through `env:` first, which the step's `if:` can read.
    env:
      DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
    steps:
      - if: ${{ env.DOCS_DISPATCH_TOKEN != '' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ env.DOCS_DISPATCH_TOKEN }}
          repository: rammp-org/rammp-org.github.io
          event-type: docs-updated
