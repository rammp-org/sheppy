[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheppy"
version = "0.1.0"
description = "Herds the ROS2 nodes of a distributed robotics project."
requires-python = ">=3.10"
dependencies = [
    "textual>=0.50",
    "pyyaml>=6.0",
]

[project.scripts]
sheppy = "sheppy.cli:main"
sheppyd = "sheppy.daemon.__main__:main"

[project.entry-points."sheppy.launchers"]
process = "sheppy.launch.builtins:ProcessLauncher"
executable = "sheppy.launch.builtins:ExecutableLauncher"
launch_file = "sheppy.launch.builtins:LaunchFileLauncher"
docker = "sheppy.launch.docker:DockerLauncher"

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["sheppy*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
